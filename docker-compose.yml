services:
  postgres:
    image: postgres:16-alpine
    container_name: diogo_barber_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: diogo_barber
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d diogo_barber']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
